services:
  - type: web
    name: industry-verse-ai-backend
    runtime: python
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: GEMINI_API_KEY
        sync: false
      - key: HUGGINGFACEHUB_API_TOKEN
        sync: false
      - key: CHROMA_PERSIST_DIR
        value: ./db/chroma
      - key: SQLITE_DB_PATH
        value: ./db/machina.db
      - key: DATASET_PATH
        value: ./data/machine_logs.json
